project:
  name: "veritext"
  language: "es"

analysis:
  similarity_threshold: 0.70
  matching_threshold: 0.70
  ai_probability_threshold: 0.70

alerts:
  levels:
    low: 0.40
    uncertain: 0.70
    high: 0.85

input:
  supported_languages:
    - "es"
    - "en"
  max_segment_length: 1000

output:
  include_evidence: true
  include_signals: true

similarity:
  model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  device: "cpu"
  batch_size: 32
  max_seq_length: 256   # the model default (128) would truncate most paragraphs
  top_k: 3
  # index_dir: data/.cache/reference_index  (built by scripts/build_index.py)

zeroshot:
  observer_model: "Qwen/Qwen2.5-0.5B"
  performer_model: "Qwen/Qwen2.5-0.5B-Instruct"
  device: "cpu"
  max_tokens: 512
  min_tokens: 16
  # Placeholder: must be calibrated on data/eval (Phase 4).
  threshold: 0.90
  temperature: 0.05
